<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>捐赠进度 - 小程序</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#F8FAF5] text-slate-900">
  <main class="mx-auto max-w-md space-y-6 px-4 pb-24 pt-6">
    <section class="rounded-xl bg-white p-5 shadow-sm">
      <p class="text-xs font-bold uppercase tracking-widest text-[#8F4D00]">物品编号 #DE20260310</p>
      <h1 class="mt-2 text-2xl font-extrabold text-[#1A4D2E]">经典复古胶片相机</h1>
      <p class="mt-2 text-sm text-slate-500">感谢你的爱心捐赠，这件物品正在进入新的公益流转旅程。</p>
    </section>
    <section class="rounded-xl bg-white p-6 shadow-sm">
      <h2 class="mb-6 text-lg font-bold text-[#1A4D2E]">流转轨迹</h2>
      <div class="space-y-6">
        <div class="flex gap-4"><div class="mt-1 h-6 w-6 rounded-full bg-[#1A4D2E] text-center text-sm font-bold text-white">1</div><div><p class="font-bold text-[#1A4D2E]">已提交</p><p class="text-sm text-slate-500">平台已收到捐赠申请与图片信息。</p></div></div>
        <div class="flex gap-4"><div class="mt-1 h-6 w-6 rounded-full bg-[#1A4D2E] text-center text-sm font-bold text-white">2</div><div><p class="font-bold text-[#1A4D2E]">平台审核 / AI整理</p><p class="text-sm text-slate-500">AI 已完成类目识别、描述草稿生成与初步价值判断。</p></div></div>
        <div class="flex gap-4"><div class="mt-1 h-6 w-6 rounded-full bg-[#FF9F45] text-center text-sm font-bold text-white">3</div><div><p class="font-bold text-[#8F4D00]">上架商城（进行中）</p><p class="text-sm text-slate-500">工作人员正在确认图文与公益说明，即将进入商城展示。</p></div></div>
        <div class="flex gap-4 opacity-50"><div class="mt-1 h-6 w-6 rounded-full bg-slate-300 text-center text-sm font-bold text-white">4</div><div><p class="font-bold text-slate-500">已售出</p><p class="text-sm text-slate-500">等待下一位主人完成认领。</p></div></div>
      </div>
    </section>
  </main>
</body>
</html>
