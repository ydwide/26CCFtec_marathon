<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>商品详情 - 小程序</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#F8FAF5] text-slate-900">
  <div class="mx-auto max-w-md pb-28">
    <div class="h-80 bg-[url('https://images.unsplash.com/photo-1513475382585-d06e58bcb0e0?auto=format&fit=crop&w=1000&q=80')] bg-cover bg-center"></div>
    <div class="-mt-6 rounded-t-[2rem] bg-white p-6 shadow-lg">
      <div class="mb-4 flex items-start justify-between">
        <div>
          <h1 class="text-2xl font-extrabold text-[#1A4D2E]">经典文学套装</h1>
          <p class="mt-2 text-sm text-slate-500">九成新，仅轻微翻阅痕迹</p>
        </div>
        <div class="text-right">
          <p class="text-3xl font-extrabold text-[#FF9F45]">¥45.00</p>
          <p class="text-xs text-slate-400 line-through">参考原价 ¥128.00</p>
        </div>
      </div>
      <div class="mb-5 flex flex-wrap gap-2">
        <span class="rounded-full bg-green-100 px-3 py-1 text-xs font-bold text-[#1A4D2E]">平台核验</span>
        <span class="rounded-full bg-orange-100 px-3 py-1 text-xs font-bold text-[#8F4D00]">公益流转</span>
        <span class="rounded-full bg-slate-100 px-3 py-1 text-xs font-bold text-slate-600">减少 2.4kg 碳排</span>
      </div>
      <section class="mb-4 rounded-xl bg-[#1A4D2E] p-5 text-white">
        <h2 class="text-lg font-bold">公益去向</h2>
        <p class="mt-2 text-sm text-white/80">该商品收益将用于支持乡村图书角与社区公益阅读项目。</p>
      </section>
      <section class="mb-4 rounded-xl bg-[#F5F7F3] p-5">
        <h2 class="text-lg font-bold text-[#1A4D2E]">捐赠来源</h2>
        <p class="mt-2 text-sm text-slate-600">来自捐赠人 @Bookworm 的分享，平台已完成清洁、检查与信息整理。</p>
      </section>
      <section class="rounded-xl bg-[#F5F7F3] p-5">
        <h2 class="text-lg font-bold text-[#1A4D2E]">物品详情</h2>
        <p class="mt-2 text-sm leading-7 text-slate-600">这套书包含多本文学经典，封面与内页保存良好，无涂写污损，适合阅读、收藏与公益再流通。</p>
      </section>
    </div>
  </div>
  <div class="fixed bottom-0 left-0 right-0 bg-[#F8FAF5]/95 px-4 pb-6 pt-4 shadow-[0_-8px_24px_rgba(26,77,46,0.08)]">
    <div class="mx-auto flex max-w-md items-center gap-3">
      <button class="rounded-full border border-slate-200 bg-white px-5 py-4 text-sm font-bold text-slate-600">咨询</button>
      <button class="flex-1 rounded-full bg-[#FF9F45] py-4 text-lg font-bold text-white">立即购买</button>
    </div>
  </div>
</body>
</html>
