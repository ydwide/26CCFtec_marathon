<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>App 首页</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#F8FAF5] text-slate-900">
  <main class="mx-auto max-w-md space-y-6 px-4 pb-28 pt-6">
    <section class="flex items-center justify-between">
      <div>
        <p class="text-sm text-slate-500">欢迎回来</p>
        <h1 class="text-2xl font-extrabold text-[#1A4D2E]">有温度的物命策展人</h1>
      </div>
      <div class="rounded-full bg-white px-4 py-2 shadow-sm">消息 3</div>
    </section>
    <section class="overflow-hidden rounded-xl bg-gradient-to-r from-[#1A4D2E] to-[#29563C] p-6 text-white shadow-lg">
      <p class="text-xs font-bold uppercase tracking-[0.2em] text-orange-200">专题策展</p>
      <h2 class="mt-2 text-3xl font-extrabold">旧物焕新专题</h2>
      <p class="mt-2 text-sm text-white/80">让每一件旧物，在新的生命里继续绽放光芒。</p>
    </section>
    <section class="rounded-xl bg-white p-5 shadow-sm">
      <div class="mb-4 flex items-center justify-between">
        <h3 class="text-lg font-bold text-[#1A4D2E]">个人公益足迹</h3>
        <span class="text-xs font-bold text-[#8F4D00]">2026 年度</span>
      </div>
      <div class="grid grid-cols-2 gap-4">
        <div class="rounded-xl bg-[#F5F7F3] p-4 text-center"><p class="text-3xl font-extrabold text-[#FF9F45]">24</p><p class="text-xs text-slate-500">累计捐赠</p></div>
        <div class="rounded-xl bg-[#F5F7F3] p-4 text-center"><p class="text-3xl font-extrabold text-[#1A4D2E]">12.5kg</p><p class="text-xs text-slate-500">减碳贡献</p></div>
      </div>
    </section>
  </main>
</body>
</html>
