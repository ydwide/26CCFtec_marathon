<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>公益档案 - App</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#F8FAF5] text-slate-900">
  <main class="mx-auto max-w-md space-y-6 px-4 pb-24 pt-6">
    <section class="rounded-xl bg-gradient-to-br from-white to-green-50 p-6 shadow-sm">
      <p class="text-xs font-bold uppercase tracking-[0.2em] text-[#1A4D2E]/60">公益档案</p>
      <h1 class="mt-2 text-5xl font-extrabold text-[#1A4D2E]">1284</h1>
      <p class="mt-1 text-sm text-slate-500">总环保贡献值（kg CO2e）</p>
    </section>
    <section class="grid grid-cols-2 gap-4">
      <div class="rounded-xl bg-white p-5 shadow-sm"><p class="text-xs text-slate-500">当前公益积分</p><p class="mt-2 text-3xl font-extrabold text-[#1A4D2E]">8450</p></div>
      <div class="rounded-xl bg-white p-5 shadow-sm"><p class="text-xs text-slate-500">累计流转</p><p class="mt-2 text-3xl font-extrabold text-[#FF9F45]">37</p></div>
      <div class="rounded-xl bg-white p-5 shadow-sm"><p class="text-xs text-slate-500">累计捐赠</p><p class="mt-2 text-3xl font-extrabold text-[#1A4D2E]">24</p></div>
      <div class="rounded-xl bg-white p-5 shadow-sm"><p class="text-xs text-slate-500">累计购买</p><p class="mt-2 text-3xl font-extrabold text-[#1A4D2E]">12</p></div>
    </section>
  </main>
</body>
</html>
