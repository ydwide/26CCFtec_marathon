<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>消息中心 - App</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#F8FAF5] text-slate-900">
  <main class="mx-auto max-w-md space-y-4 px-4 pb-24 pt-6">
    <section class="flex items-center justify-between">
      <h1 class="text-2xl font-extrabold text-[#1A4D2E]">消息中心</h1>
      <button class="rounded-full bg-white px-4 py-2 shadow-sm">筛选</button>
    </section>
    <article class="relative rounded-xl bg-white p-5 shadow-sm">
      <span class="absolute right-4 top-4 h-2 w-2 rounded-full bg-[#FF9F45]"></span>
      <h3 class="font-bold text-[#1A4D2E]">订单发货提醒</h3>
      <p class="mt-2 text-sm text-slate-600">您参与的亚麻衬衫已发货，预计 2 天后送达。</p>
    </article>
    <article class="rounded-xl bg-white p-5 shadow-sm">
      <h3 class="font-bold text-[#1A4D2E]">捐赠证书已生成</h3>
      <p class="mt-2 text-sm text-slate-600">感谢您为“绿意乡村”图书捐赠计划贡献的 12 本绘本。</p>
    </article>
  </main>
</body>
</html>
