<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI整理台 - 后台</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#F8FAF5] text-slate-900">
  <div class="flex min-h-screen">
    <aside class="w-64 bg-[#1A4D2E] p-6 text-white">
      <h1 class="mb-8 text-2xl font-extrabold">物命策展后台</h1>
      <div class="rounded-full bg-white/10 px-4 py-3 font-bold text-[#FF9F45]">AI整理台</div>
    </aside>
    <main class="flex-1 p-8">
      <div class="mb-6 flex items-center justify-between">
        <h2 class="text-3xl font-extrabold text-[#1A4D2E]">AI 智能整理台</h2>
        <span class="rounded-full bg-green-100 px-4 py-2 text-sm font-bold text-[#1A4D2E]">状态：等待策展润色</span>
      </div>
      <div class="grid grid-cols-2 gap-8">
        <section class="rounded-xl bg-white p-6 shadow-sm">
          <h3 class="mb-4 text-xl font-bold text-[#1A4D2E]">用户原始提交</h3>
          <div class="mb-4 h-72 rounded-xl bg-[url('https://images.unsplash.com/photo-1516035069371-29a1b244cc32?auto=format&fit=crop&w=1000&q=80')] bg-cover bg-center"></div>
          <div class="space-y-3 text-sm">
            <p><span class="font-bold text-slate-500">物品名称：</span>复古徕卡相机（旧）</p>
            <p><span class="font-bold text-slate-500">所属类别：</span>数码配件 / 影像</p>
            <div class="rounded-xl bg-[#F5F7F3] p-4 text-slate-600">“希望给它找个能好好照顾它的人，让它继续发挥作用。”</div>
          </div>
        </section>
        <section class="rounded-xl bg-white p-6 shadow-sm">
          <div class="mb-4 flex items-center justify-between">
            <h3 class="text-xl font-bold text-[#1A4D2E]">AI 智能策展建议</h3>
            <span class="text-3xl font-extrabold text-[#1A4D2E]">98%</span>
          </div>
          <div class="space-y-4">
            <div class="rounded-xl bg-[#F5F7F3] p-4"><label class="mb-1 block text-xs font-bold text-slate-500">建议类目</label><p class="font-semibold">经典影像 / 胶片相机</p></div>
            <div class="rounded-xl bg-[#F5F7F3] p-4"><label class="mb-1 block text-xs font-bold text-slate-500">建议标题</label><p class="font-semibold">时光掠影：1970s 复古胶片相机</p></div>
            <div class="rounded-xl bg-[#F5F7F3] p-4"><label class="mb-1 block text-xs font-bold text-slate-500">建议价格</label><p class="text-2xl font-extrabold text-[#FF9F45]">¥850.00</p></div>
          </div>
          <div class="mt-6 grid grid-cols-2 gap-3">
            <button class="col-span-2 rounded-full bg-[#FF9F45] py-4 font-bold text-[#1A4D2E]">采纳建议并提交审核</button>
            <button class="rounded-full bg-[#F5F7F3] py-4 font-bold text-slate-700">重新生成</button>
            <button class="rounded-full bg-[#1A4D2E] py-4 font-bold text-white">手动微调</button>
          </div>
        </section>
      </div>
    </main>
  </div>
</body>
</html>
