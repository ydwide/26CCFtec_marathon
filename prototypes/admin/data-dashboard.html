<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>数据看板 - 后台</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#F8FAF5] text-slate-900">
  <div class="flex min-h-screen">
    <aside class="w-64 bg-[#1A4D2E] p-6 text-white">
      <h1 class="mb-8 text-2xl font-extrabold">物命策展后台</h1>
      <div class="rounded-full bg-white/10 px-4 py-3 font-bold text-[#FF9F45]">数据看板</div>
    </aside>
    <main class="flex-1 p-8">
      <header class="mb-8">
        <h2 class="text-4xl font-extrabold text-[#1A4D2E]">影响力报表汇报</h2>
        <p class="mt-1 text-slate-500">汇聚每一份温度，见证物命重生的力量。</p>
      </header>
      <section class="mb-8 grid grid-cols-12 gap-6">
        <div class="col-span-5 rounded-xl bg-[#1A4D2E] p-8 text-white shadow-sm">
          <p class="text-xs uppercase tracking-[0.2em] text-orange-200">累计减碳总量</p>
          <p class="mt-3 text-6xl font-extrabold">12842.5<span class="ml-2 text-2xl">kg</span></p>
        </div>
        <div class="col-span-7 grid grid-cols-2 gap-6">
          <div class="rounded-xl bg-white p-8 shadow-sm"><p class="text-xs text-slate-500">累计捐赠金额</p><p class="mt-2 text-4xl font-extrabold text-[#1A4D2E]">¥458,920</p></div>
          <div class="rounded-xl bg-white p-8 shadow-sm"><p class="text-xs text-slate-500">覆盖用户数</p><p class="mt-2 text-4xl font-extrabold text-[#1A4D2E]">24,512</p></div>
        </div>
      </section>
      <section class="grid grid-cols-12 gap-6">
        <div class="col-span-8 rounded-xl bg-white p-8 shadow-sm"><h3 class="mb-6 text-xl font-bold text-[#1A4D2E]">品类流转环比增长</h3><div class="h-64 rounded-xl bg-[#F5F7F3]"></div></div>
        <div class="col-span-4 rounded-xl bg-white p-8 shadow-sm"><h3 class="mb-6 text-xl font-bold text-[#1A4D2E]">公益收益去向分布</h3><div class="mx-auto h-48 w-48 rounded-full bg-[conic-gradient(#1A4D2E_0_40%,#FF9F45_40%_65%,#4F1C26_65%_85%,#E1E3DE_85%_100%)]"></div></div>
      </section>
    </main>
  </div>
</body>
</html>
