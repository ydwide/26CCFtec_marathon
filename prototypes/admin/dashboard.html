<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>工作台 - 后台</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#F8FAF5] text-slate-900">
  <div class="flex min-h-screen">
    <aside class="w-64 bg-[#1A4D2E] p-6 text-white">
      <h1 class="mb-8 text-2xl font-extrabold">物命策展后台</h1>
      <div class="rounded-full bg-white/10 px-4 py-3 font-bold text-[#FF9F45]">工作台</div>
    </aside>
    <main class="flex-1 p-8">
      <h2 class="mb-6 text-3xl font-extrabold text-[#1A4D2E]">工作台概览</h2>
      <section class="grid grid-cols-5 gap-4">
        <div class="rounded-xl bg-white p-5 shadow-sm"><p class="text-xs text-slate-500">今日新增捐赠</p><p class="mt-2 text-4xl font-extrabold text-[#1A4D2E]">42</p></div>
        <div class="rounded-xl bg-white p-5 shadow-sm"><p class="text-xs text-slate-500">待 AI 整理</p><p class="mt-2 text-4xl font-extrabold text-[#1A4D2E]">15</p></div>
        <div class="rounded-xl bg-white p-5 shadow-sm"><p class="text-xs text-slate-500">待审核上架</p><p class="mt-2 text-4xl font-extrabold text-[#1A4D2E]">8</p></div>
        <div class="rounded-xl bg-white p-5 shadow-sm"><p class="text-xs text-slate-500">今日成交订单</p><p class="mt-2 text-4xl font-extrabold text-[#1A4D2E]">26</p></div>
        <div class="rounded-xl bg-[#1A4D2E] p-5 text-white shadow-sm"><p class="text-xs text-white/60">平均处理时长</p><p class="mt-2 text-4xl font-extrabold">2.4h</p></div>
      </section>
    </main>
  </div>
</body>
</html>
